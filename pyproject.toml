[project]
name = "playwright-ai-playground"
version = "0.1.0"
description = "Python browser automation examples using pytest, Playwright, and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.7",
    "playwright>=1.50.0",
    "pytest>=8.3.4",
    "pytest-playwright>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --browser chromium --browser-channel chrome"
