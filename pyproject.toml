[project]
name = "playwright-ai-playground"
version = "0.1.0"
description = "Python browser automation examples using pytest, Playwright, and Ollama."
readme = "README.md"
authors = [
    { name = "Robert Deringer", email = "r.deringer@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
]

[project.scripts]
playwright-ai-playground = "playwright_ai_playground:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --browser chromium --browser-channel chrome"
